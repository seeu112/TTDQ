  }
  .video-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }
  .video-overlay.show {
    display: flex;
  }
  .video-overlay-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;

    object-fit: cover;
    border-radius: 16px;
    opacity: 0;
    visibility: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 10;
    pointer-events: none;
  }
  .video-overlay-img.show {
    opacity: 1;

  }
  .image-item img {
    position: relative;
    z-index: 5;

  }
  .image-item.video-playing img {
    opacity: 0;
    visibility: hidden;
  }
</style>

  <div class="gallery-container">
    <div class="image-item-wrapper">

<script>
  var img1 = document.getElementById('img1');
  var caption1 = document.getElementById('caption1');
  var videoPlayer1 = document.getElementById('videoPlayer');
  var img2 = document.getElementById('img2');
  var caption2 = document.getElementById('caption2');
  var videoPlayer2 = document.getElementById('videoPlayer2');
  var img3 = document.getElementById('img3');
  var caption3 = document.getElementById('caption3');
  var videoPlayer3 = document.getElementById('videoPlayer3');
  var img4 = document.getElementById('img4');
  var caption4 = document.getElementById('caption4');
  var videoPlayer4 = document.getElementById('videoPlayer4');
  var img5 = document.getElementById('img5');
  var caption5 = document.getElementById('caption5');
  var videoPlayer5 = document.getElementById('videoPlayer5');
  var img6 = document.getElementById('img6');
  var caption6 = document.getElementById('caption6');
  var img7 = document.getElementById('img7');
  var caption7 = document.getElementById('caption7');
  var videoPlayer7 = document.getElementById('videoPlayer7');
  var img8 = document.getElementById('img8');
  var caption8 = document.getElementById('caption8');
  
  var currentPlayingImg = null;
  var currentVideoPlayer = null;
  
  function stopAllVideos() {
    var videos = [videoPlayer1, videoPlayer2, videoPlayer3, videoPlayer4, videoPlayer5, null, videoPlayer7, null];
    var imgs = [img1, img2, img3, img4, img5, img6, img7, img8];
    for (var i = 0; i < videos.length; i++) {
      if (videos[i]) {
        videos[i].pause();
        videos[i].currentTime = 0;
        videos[i].classList.remove('show');
      }
      if (imgs[i]) {
        imgs[i].classList.remove('video-playing');
      }
    }
    currentPlayingImg = null;
    currentVideoPlayer = null;
  }
  
  function toggleVideo(img, videoPlayer, caption) {
    if (currentPlayingImg === img) {
      img.classList.remove('video-playing');
      videoPlayer.classList.remove('show');
      videoPlayer.pause();
      videoPlayer.currentTime = 0;
      caption.classList.remove('show');
      currentPlayingImg = null;
      currentVideoPlayer = null;
    } else {
      stopAllVideos();
      img.classList.add('video-playing');
      videoPlayer.classList.add('show');
      videoPlayer.play();
      caption.classList.add('show');
      currentPlayingImg = img;
      currentVideoPlayer = videoPlayer;
    }
  }
  
  img1.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleVideo(img1, videoPlayer1, caption1);
  });
  
  img2.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleVideo(img2, videoPlayer2, caption2);
  });
  
  img3.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleVideo(img3, videoPlayer3, caption3);
  });
  
  img4.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleVideo(img4, videoPlayer4, caption4);
  });
  
  img5.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleVideo(img5, videoPlayer5, caption5);
  });
  
  img6.addEventListener('click', function(e) {
    e.stopPropagation();
    stopAllVideos();
    var captions = [caption1, caption2, caption3, caption4, caption5, caption6, caption7, caption8];
    captions.forEach(function(cap) {
      if (cap !== caption6) cap.classList.remove('show');
    });
    caption6.classList.toggle('show');
  });
  
  img7.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleVideo(img7, videoPlayer7, caption7);
  });
  
  img8.addEventListener('click', function(e) {
    e.stopPropagation();
    stopAllVideos();
    var captions = [caption1, caption2, caption3, caption4, caption5, caption6, caption7, caption8];
    captions.forEach(function(cap) {
      if (cap !== caption8) cap.classList.remove('show');
    });
    caption8.classList.toggle('show');
  });
  
  videoPlayer1.addEventListener('ended', function() {
    img1.classList.remove('video-playing');
    videoPlayer1.classList.remove('show');
    videoPlayer1.currentTime = 0;
    caption1.classList.remove('show');
    currentPlayingImg = null;
    currentVideoPlayer = null;
  });
  
  videoPlayer2.addEventListener('ended', function() {
    img2.classList.remove('video-playing');
    videoPlayer2.classList.remove('show');
    videoPlayer2.currentTime = 0;
    caption2.classList.remove('show');
    currentPlayingImg = null;
    currentVideoPlayer = null;
  });
  
  videoPlayer3.addEventListener('ended', function() {
    img3.classList.remove('video-playing');
    videoPlayer3.classList.remove('show');
    videoPlayer3.currentTime = 0;
    caption3.classList.remove('show');
    currentPlayingImg = null;
    currentVideoPlayer = null;
  });
  
  videoPlayer4.addEventListener('ended', function() {
    img4.classList.remove('video-playing');
    videoPlayer4.classList.remove('show');
    videoPlayer4.currentTime = 0;
    caption4.classList.remove('show');
    currentPlayingImg = null;
    currentVideoPlayer = null;
  });
  
  videoPlayer5.addEventListener('ended', function() {
    img5.classList.remove('video-playing');
    videoPlayer5.classList.remove('show');
    videoPlayer5.currentTime = 0;
    caption5.classList.remove('show');
    currentPlayingImg = null;
    currentVideoPlayer = null;
  });
  
  videoPlayer7.addEventListener('ended', function() {
    img7.classList.remove('video-playing');
    videoPlayer7.classList.remove('show');
    videoPlayer7.currentTime = 0;
    caption7.classList.remove('show');
    currentPlayingImg = null;
    currentVideoPlayer = null;
  });
  
  document.addEventListener('click', function(e) {
    if (!img1.contains(e.target) && !caption1.contains(e.target) &&
        !img2.contains(e.target) && !caption2.contains(e.target) &&
        !img3.contains(e.target) && !caption3.contains(e.target) &&
        !img4.contains(e.target) && !caption4.contains(e.target) &&
        !img5.contains(e.target) && !caption5.contains(e.target) &&
        !img6.contains(e.target) && !caption6.contains(e.target) &&
        !img7.contains(e.target) && !caption7.contains(e.target) &&
        !img8.contains(e.target) && !caption8.contains(e.target)) {
      stopAllVideos();
      var captions = [caption1, caption2, caption3, caption4, caption5, caption6, caption7, caption8];
      captions.forEach(function(caption) {
        caption.classList.remove('show');
      });
    }
  });
</script>
