    tags: ["环保", "日用漆器"],
    img: "天然大漆环保抑菌.jpg"
  }
];

// 提取全部标签
const allTags = [...new Set(advantageData.flatMap(item => item.tags))];
const cardList = document.getElementById("cardList");
const cardIndicator = document.getElementById("cardIndicator");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
// 渲染卡片列表（轮播）
let currentIndex = 0;
let cardsArr = [];

function buildCardHtml(item) {
  let tagStr = item.tags.map(t => `<span class="card-tag">${t}</span>`).join("");
  return `
    <div class="card">
      <div class="card-img">${item.img ? `<img src="${item.img}" alt="${item.title}" style="width:100%;height:100%;object-fit:cover;">` : '图片占位'}</div>
      <div class="card-body">
        <h3 class="card-title">${item.title}</h3>
        <p class="card-desc">${item.fullText}</p>
        ${tagStr}
      </div>
    </div>
  `;
}

function renderCards(filterTag = "all") {
  cardsArr = filterTag === "all"
    ? advantageData
    : advantageData.filter(item => item.tags.includes(filterTag));
  currentIndex = 0;
  renderCurrent();
  renderIndicator();
}

function renderCurrent() {
  if (cardsArr.length === 0) {
    cardList.innerHTML = "";
    return;
  }
  const curr = cardsArr[currentIndex];
  const prev = cardsArr[(currentIndex - 1 + cardsArr.length) % cardsArr.length];
  const next = cardsArr[(currentIndex + 1) % cardsArr.length];

  cardList.innerHTML = `
    <div class="card-side left" data-id="${prev.id}">${buildCardHtml(prev)}</div>
    ${buildCardHtml(curr)}
    <div class="card-side right" data-id="${next.id}">${buildCardHtml(next)}</div>
  `;

  // 两侧卡片点击切换
  cardList.querySelectorAll(".card-side").forEach(side => {
    side.onclick = () => {
      if (side.classList.contains("left")) {
        prevCard();
      } else {
        nextCard();
      }
    };
  });
}

function renderIndicator() {
  let html = "";
  cardsArr.forEach((_, i) => {
    html += `<div class="card-dot ${i === currentIndex ? 'active' : ''}" data-index="${i}"></div>`;
  });
  cardIndicator.innerHTML = html;
  cardIndicator.querySelectorAll(".card-dot").forEach(dot => {
    dot.onclick = () => {
      currentIndex = Number(dot.dataset.index);
      renderCurrent();
      renderIndicator();
    };
  });
}

function prevCard() {
  currentIndex = (currentIndex - 1 + cardsArr.length) % cardsArr.length;
  renderCurrent();
  renderIndicator();
}

function nextCard() {
  currentIndex = (currentIndex + 1) % cardsArr.length;
  renderCurrent();
  renderIndicator();
}

// 封面按钮逻辑
const cover = document.getElementById("cover");
const btnQi = document.getElementById("btnQi");
const btnZhi = document.getElementById("btnZhi");
const backBtn = document.getElementById("backBtn");
const pageQi = document.getElementById("pageQi");
const pageZhi = document.getElementById("pageZhi");

// 识质按钮
btnZhi.onclick = () => {
  cover.classList.add("hidden");
  pageZhi.classList.remove("hidden");
  pageQi.classList.add("hidden");
  renderCards();
};

// 识漆按钮
btnQi.onclick = () => {
  cover.classList.add("hidden");
  pageQi.classList.remove("hidden");
  pageZhi.classList.add("hidden");
};

// 返回封面
backBtn.onclick = () => {
  cover.classList.remove("hidden");
  pageQi.classList.add("hidden");
  pageZhi.classList.add("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
};

// 轮播左右切换
prevBtn.onclick = prevCard;
nextBtn.onclick = nextCard;

// 键盘左右键切换
document.addEventListener("keydown", (e) => {
  if (mask.style.display === "flex") return;
  if (e.key === "ArrowLeft") prevCard();
  if (e.key === "ArrowRight") nextCard();
});

// 页面初始化
renderCards();
</script>
</body>
</html>
