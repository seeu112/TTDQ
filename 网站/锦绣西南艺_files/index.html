<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锦绣西南</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 0% 0%, rgba(139, 90, 43, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(184, 134, 11, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 0%, rgba(218, 165, 32, 0.04) 0%, transparent 40%),
                linear-gradient(180deg, #0a0908 0%, #0d0c0b 30%, #0b0a09 70%, #080706 100%);
            overflow-x: hidden;
            font-family: 'Source Han Sans CN', sans-serif;
        }
        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }
        .title {
            margin-top: 20px;
            color: #fff;
            font-size: 28px;
            letter-spacing: 12px;
            text-align: center;
            opacity: 0.9;
        }
        .subtitle {
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            letter-spacing: 6px;
            text-align: center;
            margin-bottom: 40px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1200px;
        }
        .gallery-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            aspect-ratio: 4/3;
        }
        .gallery-item::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1.5px;
            background: linear-gradient(135deg,
                rgba(218,165,32,0.4) 0%,
                rgba(255,255,255,0.1) 25%,
                rgba(184,134,11,0.2) 50%,
                rgba(255,255,255,0.05) 75%,
                rgba(139,90,43,0.3) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 3;
            opacity: 0.6;
            transition: opacity 0.4s ease;
        }
        .gallery-item:hover::before {
            opacity: 1;
        }
        .gallery-item:hover {
            transform: translateY(-12px) scale(1.03);
            box-shadow:
                0 30px 60px rgba(0,0,0,0.5),
                0 0 80px rgba(218,165,32,0.08),
                inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            filter: contrast(1.05) saturate(1.08);
        }
        .gallery-item:hover img {
            transform: scale(1.06);
            filter: contrast(1.1) saturate(1.15) brightness(1.05);
        }
        .play-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2;
        }
        .gallery-item:hover .play-hint {
            opacity: 0.9;
        }
        .play-hint::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 20px solid #fff;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            margin-left: 4px;
        }
        .item-label {
            position: absolute;
            bottom: 12px;
            left: 16px;
            color: #fff;
            font-size: 14px;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            z-index: 2;
            pointer-events: none;
        }

        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            box-shadow:
                0 30px 60px -15px rgba(0,0,0,0.6),
                0 0 40px rgba(218,165,32,0.05),
                inset 0 1px 0 rgba(255,255,255,0.08);
            border: 1px solid rgba(218,165,32,0.1);
        }
        .modal-content video {
            max-width: 80vw;
            max-height: 80vh;
            object-fit: contain;
            display: block;
        }
        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
            z-index: 10;
        }
        .close-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .video-title {
            position: absolute;
            top: 16px;
            left: 20px;
            color: #fff;
            font-size: 16px;
            letter-spacing: 4px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">锦绣西南</div>
        <div class="subtitle">JINXIU XINAN</div>
        <div class="gallery" id="gallery"></div>
    </div>

    <div class="modal" id="videoModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="video-title" id="modalTitle"></div>
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <video id="modalVideo" controls></video>
        </div>
    </div>

    <script>
        const items = [
            { img: 'yi1.2c92c805.jpg', video: '步骤1.MP4.mp4', label: '步骤一' },
            { img: 'yi2.4173006e.jpg', video: '步骤2.MP4.mp4', label: '步骤二' },
            { img: 'yi3.ccc3a37d.jpg', video: '步骤3.MP4.mp4', label: '步骤三' },
            { img: 'yi4.6c86cfaf.jpg', video: '步骤4.MP4.mp4', label: '步骤四' },
            { img: 'yi5.cf795bcb.jpg', video: '步骤5.MP4.mp4', label: '步骤五' },
            { img: 'yi6.22cc9139.jpg', video: '步骤6.MP4.mp4', label: '步骤六' },
            { img: 'yi7.7de2c45c.jpg', video: '步骤7.MP4.mp4', label: '步骤七' }
        ];

        const gallery = document.getElementById('gallery');
        items.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'gallery-item';
            div.innerHTML = `
                <img src="${item.img}" alt="${item.label}">
                <div class="play-hint"></div>
                <div class="item-label">${item.label}</div>
            `;
            div.onclick = () => openModal(item.video, item.label);
            gallery.appendChild(div);
        });

        function openModal(videoSrc, title) {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('modalVideo');
            const modalTitle = document.getElementById('modalTitle');
            video.src = videoSrc;
            modalTitle.textContent = title;
            modal.classList.add('active');
            video.play();
        }

        function closeModal() {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('modalVideo');
            modal.classList.remove('active');
            if (video) {
                video.pause();
                video.currentTime = 0;
                video.src = '';
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
