<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脱胎漆域 - 黑金封面</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --gold: #d4af37;
            --gold-light: #ffd700;
            --gold-dark: #b8944e;
            --black: #0a0a0a;
            --black-light: #1a1410;
            --gray: #333333;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: var(--black);
            font-family: 'STKaiti', 'KaiTi', 'Microsoft YaHei', serif;
            color: #e8d9c4;
        }

        /* 粒子背景 */
        .particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 背景纹理 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(212, 175, 55, 0.06) 0%, transparent 35%);
            pointer-events: none;
            z-index: 2;
        }

        /* 顶部导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(15px);
            border-bottom: 2px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: var(--black);
        }

        .logo-circle::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid var(--gold);
        }

        .logo-circle::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold);
        }

        .logo-text {
            font-size: 20px;
            color: var(--gold);
            letter-spacing: 4px;
            font-family: 'STXingkai', 'STKaiti', serif;
        }

        /* 导航菜单 */
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        .nav-item {
            position: relative;
            padding: 8px 12px;
            color: #c4b090;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-item:hover {
            color: var(--gold);
        }

        .nav-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--gold);
            transform: translateX(-50%);
            transition: width 0.3s ease;
        }

        .nav-item:hover::after {
            width: 60%;
        }

        .nav-item.active {
            color: var(--gold);
        }

        .nav-item.active::after {
            width: 80%;
        }

        /* 右侧功能区 */
        .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #c4b090;
        }

        .icon-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .date-text {
            font-size: 14px;
            background: linear-gradient(135deg, #ffd700 0%, #d4af37 40%, #b8944e 70%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            font-family: 'STKaiti', 'KaiTi', serif;
        }

        /* 主内容区 */
        .main-content {
            padding-top: 100px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .hero-section {
            text-align: center;
            max-width: 900px;
            padding: 0 40px;
        }

        .hero-title-wrapper {
            position: relative;
            display: inline-block;
        }

        .hero-title {
            font-size: 90px;
            color: var(--gold);
            margin-bottom: 20px;
            font-family: 'STXingkai', 'STKaiti', 'Ma Shan Zheng', serif;
            letter-spacing: 8px;
            animation: fadeInUp 0.8s ease-out;
            text-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
        }

        .hero-badge {
            position: absolute;
            top: -10px;
            right: -60px;
            background: linear-gradient(180deg, #8b1212 0%, #5a0a0a 50%, #4a0808 100%);
            padding: 8px 8px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeInUp 0.8s ease-out 0.3s both;
            box-shadow: 
                0 0 20px rgba(139, 18, 18, 0.4),
                inset 0 1px 0 rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(139, 0, 0, 0.5);
        }

        .hero-badge span {
            color: #f5d76e;
            font-size: 16px;
            font-weight: bold;
            font-family: 'STXingkai', 'STKaiti', 'Ma Shan Zheng', serif;
            letter-spacing: 2px;
            line-height: 1.4;
            text-shadow: 
                0 1px 2px rgba(0, 0, 0, 0.5),
                0 0 6px rgba(245, 215, 110, 0.3);
        }

        .hero-subtitle {
            font-size: 18px;
            color: #c4b090;
            letter-spacing: 6px;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .hero-desc {
            font-size: 17px;
            line-height: 2.2;
            color: rgba(232, 217, 196, 0.8);
            margin-bottom: 60px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .hero-hint {
            font-size: 15px;
            color: rgba(212, 175, 55, 0.7);
            letter-spacing: 3px;
            animation: fadeInUp 0.8s ease-out 0.6s both;
            padding: 15px 30px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            background: rgba(212, 175, 55, 0.05);
        }

        /* 二维码容器 */
        .qr-container {
            position: fixed;
            bottom: 40px;
            left: 40px;
            width: 150px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 50;
            animation: fadeInUp 0.8s ease-out 0.8s both;
        }

        .qr-code {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
        }

        .qr-label {
            font-size: 12px;
            color: #c4b090;
            margin-top: 10px;
            letter-spacing: 2px;
            text-align: center;
        }

        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .navbar {
                padding: 0 30px;
            }

            .nav-menu {
                gap: 30px;
            }

            .nav-item {
                font-size: 14px;
            }

            .hero-title {
                font-size: 40px;
                letter-spacing: 8px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                height: 70px;
                padding: 0 20px;
            }

            .logo-text {
                display: none;
            }

            .nav-menu {
                gap: 15px;
            }

            .nav-item {
                font-size: 13px;
                padding: 8px 10px;
            }

            .nav-right {
                gap: 15px;
            }

            .date-text {
                display: none;
            }

            .hero-title {
                font-size: 32px;
                letter-spacing: 6px;
            }

            .hero-subtitle {
                font-size: 15px;
            }

            .hero-desc {
                font-size: 15px;
            }

            .feature-cards {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        @media (max-width: 480px) {
            .nav-menu {
                gap: 8px;
            }

            .nav-item {
                font-size: 12px;
                padding: 5px 8px;
            }

            .hero-title {
                font-size: 26px;
                letter-spacing: 4px;
            }

            .hero-subtitle {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- 粒子背景 -->
    <canvas class="particle-canvas"></canvas>

    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <!-- 左侧Logo -->
        <div class="logo">
            <div class="logo-circle"></div>
            <span class="logo-text">福州脱胎漆</span>
        </div>

        <!-- 中间导航菜单 -->
        <div class="nav-menu">
            <div class="nav-item active">首页</div>
            <div class="nav-item" data-url="脱胎漆的介绍＋优势/index.html">脱胎漆介绍</div>
            <div class="nav-item" data-url="脱胎漆的历史/index.html">历史溯源</div>
            <div class="nav-item" data-url="脱胎漆域.html">脱胎漆域</div>
            <div class="nav-item" data-url="1.html">技艺源流</div>
            <div class="nav-item" data-url="技法封面.html">技法传承</div>
            <div class="nav-item" data-url="黑金漆艺/index.html">脱胎纹貌</div>
            <div class="nav-item" data-url="脱胎漆干燥程度/脱胎漆器干燥环境模拟器.html">干燥模拟</div>
        </div>

        <!-- 右侧功能区 -->
        <div class="nav-right">
            <div class="icon-btn" title="搜索">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </div>
            <div class="icon-btn" title="分享">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
                </svg>
            </div>
            <div class="icon-btn" title="更多">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="1"/>
                    <circle cx="12" cy="5" r="1"/>
                    <circle cx="12" cy="19" r="1"/>
                </svg>
            </div>
            <div class="date-text" id="current-date"></div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">
        <section class="hero-section">
            <div class="hero-title-wrapper">
                <h1 class="hero-title">脱胎漆</h1>
                <div class="hero-badge">
                    <span>非</span>
                    <span>遗</span>
                </div>
            </div>
            <p class="hero-subtitle">福州脱胎漆器 · 非遗传承</p>
            <p class="hero-desc">
                福州脱胎漆器是中国传统工艺瑰宝，以"薄如纸、轻如蝉翼"著称。
                源自战国夹纻技艺，历经千年传承，于清乾隆年间由沈绍安发扬光大，
                以独特的脱胎技法、精美的髹饰工艺闻名于世，被誉为"东方艺术明珠"。
            </p>
            <div class="hero-hint">请从顶部导航栏选择您想了解的内容</div>
        </section>
    </main>

    <!-- 左下角二维码容器 -->
    <div class="qr-container">
        <img src="脱胎漆域_files/二维码.png" alt="二维码" class="qr-code">
        <div class="qr-label">扫码了解更多</div>
    </div>

    <script>
        // 导航菜单点击
        const navItems = document.querySelectorAll('.nav-item');
        
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const url = item.dataset.url;
                window.location.href = url;
            });
        });

        // 更新日期显示
        function updateDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekDay = weekDays[now.getDay()];
            const dateStr = `${year}-${month}-${day} ${weekDay}`;
            document.getElementById('current-date').textContent = dateStr;
        }

        // 页面加载时更新日期
        updateDate();

        // 卡片导航
        function navigateTo(url) {
            window.location.href = url;
        }

        // 粒子动画
        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
                this.initParticles();
                this.animate();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            initParticles() {
                for (let i = 0; i < 50; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        size: Math.random() * 1.5 + 0.3,
                        speedX: (Math.random() - 0.5) * 0.2,
                        speedY: (Math.random() - 0.5) * 0.2,
                        opacity: Math.random() * 0.25 + 0.08,
                        hue: Math.random() * 15 + 30
                    });
                }
            }

            update() {
                this.particles.forEach(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    if (p.x < 0 || p.x > this.canvas.width) p.speedX *= -1;
                    if (p.y < 0 || p.y > this.canvas.height) p.speedY *= -1;
                });
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.particles.forEach(p => {
                    const gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 5);
                    gradient.addColorStop(0, `hsla(${p.hue}, 55%, 60%, ${p.opacity})`);
                    gradient.addColorStop(1, `hsla(${p.hue}, 40%, 45%, 0)`);
                    
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size * 5, 0, Math.PI * 2);
                    this.ctx.fillStyle = gradient;
                    this.ctx.fill();

                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = `hsla(${p.hue}, 50%, 75%, ${p.opacity * 1.5})`;
                    this.ctx.fill();
                });
            }

            animate() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }

        const canvas = document.querySelector('.particle-canvas');
        if (canvas) {
            const ps = new ParticleSystem(canvas);
            window.addEventListener('resize', () => ps.resize());
        }
    </script>
</body>
</html>
