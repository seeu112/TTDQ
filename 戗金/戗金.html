<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #000000;
            padding: 100px 20px 40px;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }
        
        .nav-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            z-index: 1000;
            padding: 15px 20px;
        }
        
        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .nav-title {
            color: #d4af37;
            font-size: 1.2rem;
            font-family: 'STKaiti', 'KaiTi', '楷体', serif;
            letter-spacing: 4px;
        }
        
        .nav-links {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        
        .nav-links a {
            color: rgba(212, 175, 55, 0.6);
            text-decoration: none;
            font-size: 0.9rem;
            font-family: 'STKaiti', 'KaiTi', '楷体', serif;
            letter-spacing: 2px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .nav-links a:hover {
            color: #d4af37;
            background: rgba(212, 175, 55, 0.1);
        }
        
        .nav-links a.active {
            color: #d4af37;
            background: rgba(212, 175, 55, 0.15);
        }

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .title-decoration-top {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        .title-line-top {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c9a962);
        }

        .title-dot {
            width: 8px;
            height: 8px;
            background: #c9a962;
            border-radius: 50%;
            margin: 0 8px;
        }

        .main-title {
            font-size: 3.5rem;
            color: #c9a962;
            letter-spacing: 0.8em;
            font-weight: normal;
            margin-bottom: 25px;
            font-family: 'STKaiti', 'KaiTi', serif;
        }

        .title-decoration-bottom {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .title-line-bottom {
            width: 180px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c9a962, transparent);
        }

        .subtitle {
            font-size: 0.85rem;
            color: #8b7355;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        .gallery-item {
            display: flex;
            flex-direction: column;
        }

        .media-container {
            position: relative;
            width: 100%;
            height: 280px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .media-container img,
        .media-container .gif-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-container .gif-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .media-container .gif-container img {
            position: static;
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: default;
            transition: none;
        }

        .media-container .gif-container img:hover {
            transform: none;
        }

        .gallery-text {
            font-size: 1rem;
            color: #c9a962;
            line-height: 1.8;
            font-family: 'STKaiti', 'KaiTi', serif;
            letter-spacing: 0.1em;
            padding: 20px 25px;
            background-color: #1a1a1a;
            border: 2px solid #c9a962;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(201, 169, 98, 0.5), 0 0 30px rgba(201, 169, 98, 0.3);
            margin-bottom: 12px;
        }

        .audio-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: fit-content;
            margin: 0 auto;
            padding: 10px 24px;
            background: rgba(201, 169, 98, 0.1);
            border: 1px solid #c9a962;
            border-radius: 30px;
            color: #c9a962;
            font-family: 'STKaiti', 'KaiTi', serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .audio-btn:hover {
            background: rgba(201, 169, 98, 0.2);
            box-shadow: 0 0 15px rgba(201, 169, 98, 0.4);
        }

        .audio-btn.playing {
            background: rgba(201, 169, 98, 0.25);
            animation: pulse 1.5s infinite;
        }

        .audio-btn .icon {
            width: 18px;
            height: 18px;
            position: relative;
        }

        .audio-btn .icon::before,
        .audio-btn .icon::after {
            content: '';
            position: absolute;
            background: #c9a962;
            transition: all 0.3s ease;
        }

        .audio-btn .icon::before {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 9px 0 9px 15px;
            border-color: transparent transparent transparent #c9a962;
            left: 0;
            top: 0;
        }

        .audio-btn.playing .icon::before {
            border-width: 0;
        }

        .audio-btn.playing .icon::after {
            width: 4px;
            height: 18px;
            left: 0;
            top: 0;
            animation: sound 0.5s infinite;
        }

        .audio-btn.playing .icon::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 12px;
            background: #c9a962;
            left: 0;
            top: 3px;
            animation: sound 0.5s infinite;
        }

        .audio-btn.playing .icon::before {
            content: '';
            position: absolute;
            width: 4px;
            height: 18px;
            background: #c9a962;
            left: 6px;
            top: 0;
            animation: sound 0.5s infinite 0.1s;
        }

        .audio-btn.playing .icon::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 10px;
            background: #c9a962;
            left: 12px;
            top: 4px;
            animation: sound 0.5s infinite 0.2s;
        }

        @keyframes sound {
            0%, 100% { height: 12px; }
            50% { height: 18px; }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(201, 169, 98, 0.3); }
            50% { box-shadow: 0 0 20px rgba(201, 169, 98, 0.5); }
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 2rem;
                letter-spacing: 0.4em;
            }

            .title-line-bottom {
                width: 100px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 35px;
            }

            .media-container {
                height: 250px;
            }

            .gallery-text {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

    <script>
        const audioBtns = document.querySelectorAll('.audio-btn');
        let currentAudio = null;

        audioBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const audioSrc = btn.dataset.audio;
                
                if (currentAudio && currentAudio.src.includes(audioSrc) && !currentAudio.paused) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    btn.classList.remove('playing');
                    currentAudio = null;
                    return;
                }

                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    document.querySelector('.audio-btn.playing')?.classList.remove('playing');
                }

                currentAudio = new Audio(audioSrc);
                currentAudio.play();
                btn.classList.add('playing');

                currentAudio.addEventListener('ended', () => {
                    btn.classList.remove('playing');
                    currentAudio = null;
                });

                currentAudio.addEventListener('error', () => {
                    btn.classList.remove('playing');
                    currentAudio = null;
                });
            });
        });
    </script>
