<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第一章 - 上古夹纻工艺</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:#1a1410;
      min-height:100vh;
      font-family:'Noto Serif SC', serif;
      color:#e8d9c4;
      overflow:hidden;
    }
    .bg-main{
      position:absolute;top:0;left:0;right:0;bottom:0;
      background:url('战国背景.png') center/cover no-repeat;
      opacity:0.8;
      z-index:1;
    }
    .bg-overlay{
      position:absolute;top:0;left:0;right:0;bottom:0;
      background:linear-gradient(180deg, rgba(13,10,8,0.8) 0%, rgba(13,10,8,0.9) 100%);
      z-index:2;
    }
    .content{
      position:relative;
      z-index:10;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:40px;
    }
    .chapter-badge{
      font-size:14px;color:#d4b87a;
      letter-spacing:8px;
      margin-bottom:30px;
      animation:fadeInUp 1s ease-out;
    }
    .main-title{
      font-size:56px;color:#d4b87a;
      margin-bottom:20px;
      text-shadow:0 0 30px rgba(212,184,122,0.3);
      animation:fadeInUp 1s ease-out 0.2s both;
    }
    .subtitle{
      font-size:24px;color:#c4b090;
      opacity:0.8;
      margin-bottom:80px;
      animation:fadeInUp 1s ease-out 0.4s both;
    }
    .continue-btn{
      position:relative;
      padding:18px 60px;
      border:1px solid #d4b87a;
      background:transparent;
      color:#d4b87a;
      font-size:16px;
      font-family:'Noto Serif SC', serif;
      letter-spacing:4px;
      cursor:pointer;
      transition:all 0.3s ease;
      animation:fadeInUp 1s ease-out 0.6s both;
      overflow:hidden;
    }
    .continue-btn::before{
      content:"";
      position:absolute;
      top:0;left:-100%;
      width:100%;height:100%;
      background:linear-gradient(90deg, transparent, rgba(212,184,122,0.2), transparent);
      transition:left 0.5s ease;
    }
    .continue-btn:hover{
      background:#d4b87a;
      color:#1a1410;
      box-shadow:
        0 0 20px rgba(212,184,122,0.4),
        0 0 40px rgba(212,184,122,0.2);
      transform:translateY(-2px);
    }
    .continue-btn:hover::before{
      left:100%;
    }
    .decoration-line{
      width:80px;height:1px;
      background:linear-gradient(90deg, transparent, #d4b87a, transparent);
      margin-bottom:30px;
      animation:fadeInUp 1s ease-out 0.3s both;
    }
    /* 返回首页按钮 */
    .back-button-container{
      position:fixed;
      top:20px;left:20px;
      z-index:100;
    }
    .back-button{
      width:48px;
      height:48px;
      background:linear-gradient(145deg, rgba(45,35,28,0.95), rgba(20,15,10,0.95));
      border:2px solid rgba(212,184,122,0.4);
      border-radius:50%;
      color:#d4b87a;
      font-size:20px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:all 0.3s ease;
      animation:fadeInUp 1s ease-out 0.8s both;
      box-shadow:
        0 4px 15px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(212,184,122,0.1);
    }
    .back-button:hover{
      background:linear-gradient(145deg, rgba(212,184,122,0.3), rgba(180,150,100,0.2));
      border-color:#d4b87a;
      transform:scale(1.1);
      box-shadow:
        0 6px 20px rgba(212,184,122,0.3),
        0 0 20px rgba(212,184,122,0.15);
    }
    /* 目录导航 */
    .toc-container{
      position:fixed;
      top:20px;right:20px;
      z-index:100;
    }
    .toc-toggle{
      width:48px;
      height:48px;
      background:linear-gradient(145deg, rgba(45,35,28,0.95), rgba(20,15,10,0.95));
      border:2px solid rgba(212,184,122,0.4);
      border-radius:50%;
      color:#d4b87a;
      font-size:18px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:all 0.3s ease;
      animation:fadeInUp 1s ease-out 0.8s both;
      box-shadow:
        0 4px 15px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(212,184,122,0.1);
    }
    .toc-toggle:hover{
      background:linear-gradient(145deg, rgba(212,184,122,0.3), rgba(180,150,100,0.2));
      border-color:#d4b87a;
      transform:scale(1.1);
      box-shadow:
        0 6px 20px rgba(212,184,122,0.3),
        0 0 20px rgba(212,184,122,0.15);
    }
    .toc-menu{
      position:absolute;
      top:0;
      right:50px;
      background:rgba(26,20,16,0.95);
      border:1px solid rgba(212,184,122,0.3);
      padding:20px 15px;
      opacity:0;
      visibility:hidden;
      transform:translateX(10px);
      transition:all 0.3s ease;
      min-width:180px;
    }
    .toc-menu.show{
      opacity:1;
      visibility:visible;
      transform:translateX(0);
    }
    .toc-title{
      font-size:10px;color:#8a7a60;
      letter-spacing:4px;
      margin-bottom:15px;
      text-align:center;
    }
    .toc-button{
      display:block;
      width:100%;
      padding:10px 15px;
      margin-bottom:8px;
      background:transparent;
      border:1px solid rgba(212,184,122,0.3);
      color:#c4b090;
      font-size:12px;
      text-align:left;
      cursor:pointer;
      transition:all 0.3s ease;
      font-family:'Noto Serif SC', serif;
    }
    .toc-button:hover{
      background:rgba(212,184,122,0.2);
      border-color:#d4b87a;
      color:#d4b87a;
      transform:translateX(-5px);
    }
    .toc-button.active{
      background:rgba(212,184,122,0.3);
      border-color:#d4b87a;
      color:#d4b87a;
    }
    @keyframes fadeInUp{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="bg-main"></div>
  <div class="bg-overlay"></div>
  
  <!-- 返回首页按钮 -->
  <div class="back-button-container">
    <button class="back-button" onclick="goBack()">←</button>
  </div>
  
  <!-- 目录导航 -->
  <div class="toc-container">
    <button class="toc-toggle" onclick="toggleMenu()">☰</button>
    <div class="toc-menu" id="tocMenu">
      <div class="toc-title">CONTENTS</div>
      <button class="toc-button active" onclick="goToChapter(0)">战国·夹纻起源</button>
      <button class="toc-button" onclick="goToChapter(1)">乾隆·沈绍安创艺</button>
      <button class="toc-button" onclick="goToChapter(2)">晚清·万国博览</button>
      <button class="toc-button" onclick="goToChapter(3)">1949后·国礼漆器</button>
      <button class="toc-button" onclick="goToChapter(4)">2006·国家级非遗</button>
      <button class="toc-button" onclick="goToChapter(5)">现代·漆艺文创</button>
    </div>
  </div>
  
  <div class="content">
    <div class="chapter-badge">CHAPTER ONE</div>
    <div class="decoration-line"></div>
    <h1 class="main-title">上古夹纻工艺</h1>
    <p class="subtitle">战国至汉魏 · 脱胎漆器之始</p>
    <button class="continue-btn" onclick="enterDetail()">Continue →</button>
  </div>
  
  <script>
    function enterDetail(){
      window.location.href = 'detail_0.html';
    }
    function goToChapter(index){
      window.location.href = 'cover_' + index + '.html';
    }
    function toggleMenu(){
      var menu = document.getElementById('tocMenu');
      menu.classList.toggle('show');
    }
    function goBack(){
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
