<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>采漆方法</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #000;
      min-height: 100vh;
      padding: 140px 20px 60px;
      font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
    }
    
    .nav-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
      z-index: 1000;
      padding: 15px 20px;
    }
    
    .nav-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .nav-title {
      color: #d4af37;
      font-size: 1.2rem;
      font-family: 'STKaiti', 'KaiTi', '楷体', serif;
      letter-spacing: 4px;
    }
    
    .nav-links {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    
    .nav-links a {
      color: rgba(212, 175, 55, 0.6);
      text-decoration: none;
      font-size: 0.9rem;
      font-family: 'STKaiti', 'KaiTi', '楷体', serif;
      letter-spacing: 2px;
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    
    .nav-links a:hover {
      color: #d4af37;
      background: rgba(212, 175, 55, 0.1);
    }
    
    .nav-links a.active {
      color: #d4af37;
      background: rgba(212, 175, 55, 0.15);
    }

    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-title-wrapper {
      text-align: center;
      margin-bottom: 50px;
      position: relative;
    }

    .gallery-title-top-line {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .gallery-title-top-line::before,
    .gallery-title-top-line::after {
      content: '';
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #daa520);
    }

    .gallery-title-top-line::after {
      background: linear-gradient(90deg, #daa520, transparent);
    }

    .gallery-title-top-dots {
      display: flex;
      gap: 8px;
    }

    .gallery-title-top-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #daa520;
    }

    .gallery-title-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .gallery-title-main::before,
    .gallery-title-main::after {
      content: '';
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(218, 165, 32, 0.5));
    }

    .gallery-title-main::after {
      background: linear-gradient(90deg, rgba(218, 165, 32, 0.5), transparent);
    }

    .gallery-title {
      color: #daa520;
      font-size: 3.8rem;
      font-weight: 500;
      font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
      letter-spacing: 32px;
      position: relative;
      padding: 0 20px;
      text-shadow: 
        0 0 20px rgba(218, 165, 32, 0.3),
        0 0 40px rgba(218, 165, 32, 0.1);
    }

    .gallery-title-sub {
      color: #a08060;
      font-size: 0.95rem;
      font-family: 'Playfair Display', 'Times New Roman', serif;
      letter-spacing: 15px;
      text-transform: uppercase;
      opacity: 0.85;
      font-weight: 400;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      padding: 20px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
    }

    .gallery-item:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    .gallery-item .item-image-wrapper {
      aspect-ratio: 4/3;
      overflow: hidden;
    }

    .gallery-item:hover img {
      transform: scale(1.08);
    }

    .item-description {
      padding: 15px;
      background: rgba(0, 0, 0, 0.8);
      border-top: 1px solid rgba(218, 165, 32, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .item-description-text {
      color: #daa520;
      font-size: 0.9rem;
      line-height: 1.6;
      text-align: center;
      letter-spacing: 1px;
      font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
    }

    .gallery-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, 
        rgba(218, 165, 32, 0.1) 0%, 
        transparent 50%, 
        rgba(139, 90, 43, 0.1) 100%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .gallery-item:hover::before {
      opacity: 1;
    }

    .image-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
      transform: translateY(100%);
      transition: transform 0.4s ease;
    }

    .gallery-item:hover .image-overlay {
      transform: translateY(0);
    }

    .image-number {
      color: #daa520;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .image-caption {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
      margin-top: 5px;
      opacity: 0.7;
    }

    .description-panel {
      max-width: 800px;
      margin: 30px auto 0;
      padding: 25px 30px;
      background: linear-gradient(135deg, rgba(20, 18, 15, 0.95), rgba(10, 8, 6, 0.98));
      border: 1px solid rgba(218, 165, 32, 0.2);
      border-radius: 16px;
      opacity: 1;
      transform: translateY(0);
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .description-panel.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .description-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 1px;
      background: linear-gradient(135deg, 
        rgba(218, 165, 32, 0.3) 0%, 
        rgba(139, 90, 43, 0.1) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .description-text {
      color: rgba(255, 255, 255, 0.85);
      font-size: 1.1rem;
      line-height: 1.8;
      text-align: center;
      letter-spacing: 2px;
      font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
    }

    .description-text::first-letter {
      color: #daa520;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .gallery-item.active {
      box-shadow: 0 0 30px rgba(218, 165, 32, 0.4);
      border: 1px solid rgba(218, 165, 32, 0.5);
    }

    .play-btn {
      background: rgba(218, 165, 32, 0.15);
      border: 1px solid rgba(218, 165, 32, 0.4);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 0;
    }

    .play-btn:hover {
      background: rgba(218, 165, 32, 0.3);
      box-shadow: 0 0 15px rgba(218, 165, 32, 0.3);
      transform: scale(1.1);
    }

    .play-btn.playing {
      background: rgba(218, 165, 32, 0.4);
      border-color: rgba(218, 165, 32, 0.8);
    }

    .play-btn.playing:hover {
      transform: scale(1.1);
    }

    .play-icon,
    .pause-icon {
      font-size: 12px;
      color: #daa520;
      line-height: 1;
    }

    .pause-icon {
      display: none;
    }

    .play-btn.playing .play-icon {
      display: none;
    }

    .play-btn.playing .pause-icon {
      display: inline;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      body {
        padding: 50px 15px;
      }

      .gallery-title {
        font-size: 2rem;
        letter-spacing: 15px;
      }

      .gallery-title-main::before,
      .gallery-title-main::after {
        width: 60px;
      }

      .gallery-title-sub {
        font-size: 0.7rem;
        letter-spacing: 8px;
      }

      .gallery-grid {
        gap: 18px;
        padding: 15px;
      }

      .gallery-item {
        aspect-ratio: 1;
      }
    }

    @media (max-width: 480px) {
      .gallery-title {
        font-size: 1.5rem;
        letter-spacing: 10px;
      }

      .gallery-title-main::before,
      .gallery-title-main::after {
        width: 40px;
      }

      .gallery-title-sub {
        font-size: 0.6rem;
        letter-spacing: 6px;
      }

      .gallery-grid {
        gap: 12px;
      }
    }
  </style>
</head>

      </div>
    </div>
  </div>
  <div class="gallery-container">
    <div class="gallery-title-wrapper">
      <div class="gallery-title-top-line">
        <div class="gallery-title-top-dots">
          <span class="gallery-title-top-dot"></span>
          <span class="gallery-title-top-dot"></span>
        </div>
      </div>
      <div class="gallery-title-main">
        <h1 class="gallery-title">采漆方法</h1>
      </div>
      <div class="gallery-title-sub">LACQUER COLLECTION</div>
    </div>
    
    <div class="gallery-grid">
      <div class="gallery-item" id="item1">
        <div class="item-image-wrapper">
          <img src="./采漆方法_files/1.gif" alt="采漆步骤1" class="item-image">
        </div>
        <div class="item-description">
          <p class="item-description-text">先在漆树上找到合适的位置，快速地沿着漆路划出两个半月形的切口，既不能回刀，也不能补刀，否则一滴漆都不会流出。</p>
          <button class="play-btn" data-audio="./采漆方法_files/1.mp3">
            <span class="play-icon">▶</span>
            <span class="pause-icon">⏸</span>
          </button>
        </div>
      </div>
      
      <div class="gallery-item" id="item2">
        <div class="item-image-wrapper">
          <img src="./采漆方法_files/2.gif" alt="采漆步骤2" class="item-image">
        </div>
        <div class="item-description">
          <p class="item-description-text">割好漆口，在其下方再割一个"茧口"。装上"茧子"，漆液就会顺着割口流到"茧子"里。刚流出的生漆呈乳白色，流到"茧子"里之后，漆酚快速氧化，生漆会变成褐色，这也是古代家具最常见的颜色。</p>
          <button class="play-btn" data-audio="./采漆方法_files/2.mp3">
            <span class="play-icon">▶</span>
            <span class="pause-icon">⏸</span>
          </button>
        </div>
      </div>
      
      <div class="gallery-item" id="item3">
        <div class="item-image-wrapper">
          <img src="./采漆方法_files/3.gif" alt="采漆步骤3" class="item-image">
        </div>
        <div class="item-description">
          <p class="item-description-text">收下"茧子"，用刮板或小毛笔将"茧子"中的漆液收入盛漆的竹筒。</p>
          <button class="play-btn" data-audio="./采漆方法_files/3.mp3">
            <span class="play-icon">▶</span>
            <span class="pause-icon">⏸</span>
          </button>
        </div>
      </div>
      
      <div class="gallery-item" id="item4">
        <div class="item-image-wrapper">
          <img src="./采漆方法_files/4.gif" alt="采漆步骤4" class="item-image">
        </div>
        <div class="item-description">
          <p class="item-description-text">每收一个"茧子"，都用刮板把漆口抚平，以便它自然愈合。</p>
          <button class="play-btn" data-audio="./采漆方法_files/4.mp3">
            <span class="play-icon">▶</span>
            <span class="pause-icon">⏸</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    const playButtons = document.querySelectorAll('.play-btn');
    let currentAudio = null;
    let currentButton = null;

    playButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        const audioSrc = this.dataset.audio;
        
        if (currentAudio && currentAudio.src === audioSrc) {
          if (currentAudio.paused) {
            currentAudio.play();
            this.classList.add('playing');
          } else {
            currentAudio.pause();
            this.classList.remove('playing');
          }
        } else {
          if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentButton.classList.remove('playing');
          }
          
          currentAudio = new Audio(audioSrc);
          currentButton = this;
          
          currentAudio.play();
          this.classList.add('playing');
          
          currentAudio.addEventListener('ended', function() {
            currentButton.classList.remove('playing');
          });
        }
      });
    });
  </script>
