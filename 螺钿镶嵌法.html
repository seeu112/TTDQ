    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            min-height: 100vh;
            padding: 140px 20px 80px;
            font-family: 'Noto Serif SC', 'SimSun', 'STSong', serif;
        }
        
        .nav-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            z-index: 1000;
            padding: 15px 20px;
        }
        
        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .nav-title {
            color: #d4af37;
            font-size: 1.2rem;
            font-family: 'STKaiti', 'KaiTi', '楷体', serif;
            letter-spacing: 4px;
        }
        
        .nav-links {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        
        .nav-links a {
            color: rgba(212, 175, 55, 0.6);
            text-decoration: none;
            font-size: 0.9rem;
            font-family: 'STKaiti', 'KaiTi', '楷体', serif;
            letter-spacing: 2px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .nav-links a:hover {
            color: #d4af37;
            background: rgba(212, 175, 55, 0.1);
        }
        
        .nav-links a.active {
            color: #d4af37;
            background: rgba(212, 175, 55, 0.15);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 80px;
            position: relative;
        }

        .header-top-line {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-top-line::before,
        .header-top-line::after {
            content: '';
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37);
        }

        .header-top-line::after {
            background: linear-gradient(90deg, #d4af37, transparent);
        }

        .header-top-line .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d4af37;
        }

        h1 {
            font-size: 4.5rem;
            color: #f4d03f;
            font-weight: 400;
            letter-spacing: 1em;
            margin-bottom: 35px;
            font-family: 'Noto Serif SC', 'SimSun', 'STSong', serif;
            position: relative;
            padding: 0 100px;
            text-shadow: 0 0 30px rgba(244, 208, 63, 0.2);
        }

        h1::before,
        h1::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 150px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(244, 208, 63, 0.5));
        }

        h1::before {
            left: 0;
            transform: translateY(-50%);
        }

        h1::after {
            right: 0;
            transform: translateY(-50%);
            background: linear-gradient(90deg, rgba(244, 208, 63, 0.5), transparent);
        }

        .subtitle {
            font-size: 1rem;
            color: rgba(244, 208, 63, 0.4);
            letter-spacing: 1em;
            text-transform: uppercase;
            margin-top: 15px;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-weight: 300;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .gallery-item {
            aspect-ratio: 4/3;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(244, 208, 63, 0.15);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.5s ease;
        }

        .gallery-item:hover {
            border-color: rgba(244, 208, 63, 0.4);
            box-shadow: 0 0 30px rgba(244, 208, 63, 0.1);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        .gallery-item::before {
            content: attr(data-index);
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 0.85rem;
            color: rgba(244, 208, 63, 0.7);
            font-weight: 300;
            letter-spacing: 3px;
            opacity: 0;
            transition: all 0.4s ease;
            text-shadow: 0 0 10px rgba(244, 208, 63, 0.5);
        }

        .gallery-item:hover::before {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-item.active::before {
            opacity: 1;
        }

        .gallery-item.active img {
            transform: scale(1.08);
        }

        .gallery-item.active {
            border-color: rgba(244, 208, 63, 0.6);
            box-shadow: 0 0 40px rgba(244, 208, 63, 0.15);
        }

        .gallery-item-wrapper {
            display: flex;
            flex-direction: column;
        }

        .gallery-item-wrapper .caption {
            order: 2;
            margin-top: 15px;
            padding: 18px 25px;
            background: rgba(0, 0, 0, 0.9);
            color: #f4d03f;
            font-size: 1rem;
            line-height: 1.8;
            opacity: 1;
            transform: translateY(0);
            font-family: 'Noto Serif SC', 'SimSun', 'STSong', serif;
            letter-spacing: 2px;
            text-align: center;
            border: 1px solid #f4d03f;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(244, 208, 63, 0.15), inset 0 0 20px rgba(244, 208, 63, 0.05);
            pointer-events: none;
        }

        .audio-btn {
            order: 3;
            margin-top: 10px;
            padding: 10px 30px;
            background: rgba(244, 208, 63, 0.1);
            color: #f4d03f;
            border: 1px solid rgba(244, 208, 63, 0.4);
            border-radius: 30px;
            font-size: 0.9rem;
            font-family: 'Noto Serif SC', 'SimSun', 'STSong', serif;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-left: auto;
            margin-right: auto;
        }

        .audio-btn:hover {
            background: rgba(244, 208, 63, 0.2);
            border-color: #f4d03f;
            box-shadow: 0 0 20px rgba(244, 208, 63, 0.2);
        }

        .audio-btn.playing {
            background: rgba(244, 208, 63, 0.3);
            border-color: #f4d03f;
        }

        .audio-btn::before {
            content: '▶';
            font-size: 0.7rem;
        }

        .audio-btn.playing::before {
            content: '⏸';
        }





        @media (max-width: 1200px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 50px 15px;
            }

            h1 {
                font-size: 2.2rem;
                letter-spacing: 0.5em;
                padding: 0 30px;
                text-shadow: 0 0 20px rgba(244, 208, 63, 0.2);
            }

            h1::before,
            h1::after {
                width: 50px;
            }

            .header-top-line::before,
            .header-top-line::after {
                width: 25px;
            }

            .subtitle {
                font-size: 0.8rem;
                letter-spacing: 0.6em;
            }

            .header {
                margin-bottom: 50px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .gallery-item {
                border-width: 1px;
            }

            .gallery-item .caption {
                font-size: 0.85rem;
                padding: 15px 20px;
                letter-spacing: 1px;
            }
        }
    </style>

        <div class="gallery">
            <div class="gallery-item-wrapper">
                <div class="gallery-item" data-index="01" data-caption="准备一块上过灰漆的平实漆板。">
                    <img src="./螺钿镶嵌法_files/1.jpeg" alt="步骤1">

                <button class="audio-btn" data-audio="1.mp3">听讲解</button>

            <div class="gallery-item-wrapper">

            <div class="gallery-item-wrapper">

            <div class="gallery-item-wrapper">
                <div class="gallery-item" data-index="10" data-caption="灰漆干燥后，用灰条打磨器表，将其研磨平滑。这时，漆灰地会略微低于螺钿图案，这是螺钿硬、灰漆软的缘故。">
                    <img src="./螺钿镶嵌法_files/10.gif" alt="步骤10">

                </div>

                <button class="audio-btn" data-audio="14.mp3">听讲解</button>
            </div>

                    <img src="./螺钿镶嵌法_files/15.jpeg" alt="步骤15">
                </div>
                <div class="caption"></div>
                <button class="audio-btn" data-audio="15.mp3">听讲解</button>
            </div>
        </div>
    </div>
    <script>
        const galleryItems = document.querySelectorAll('.gallery-item');
        const audioBtns = document.querySelectorAll('.audio-btn');
        let currentAudio = null;
        let currentBtn = null;
        
        galleryItems.forEach(item => {
            const wrapper = item.parentElement;
            const caption = wrapper.querySelector('.caption');
            caption.textContent = item.dataset.caption;
        });

        audioBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const audioSrc = `./螺钿镶嵌法_files/${this.dataset.audio}`;
                
                if (currentAudio && currentAudio.src === audioSrc) {
                    if (currentAudio.paused) {
                        currentAudio.play();
                        this.classList.add('playing');
                    } else {
                        currentAudio.pause();
                        this.classList.remove('playing');
                    }
                } else {
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                        currentBtn.classList.remove('playing');
                    }
                    
                    currentAudio = new Audio(audioSrc);
                    currentBtn = this;
                    
                    currentAudio.addEventListener('ended', function() {
                        currentBtn.classList.remove('playing');
                    });
                    
                    currentAudio.play();
                    this.classList.add('playing');
                }
            });
        });
    </script>
